root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."

bin = "tmp/main"

full_bin = "APP_NEV=dev APP_USER=air ./tmp/main 80"

include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor"]
include_dir = []
exclude_files = []
exclude_regex = ["_test.go"]
exclude_unchanged = true
follow_symlinks = true
log = "air.log"
deploy = 1000
stop_on_error = true
send_interrupt = false
kill_delay = 500

[log]
time = false

[color]
main = "green"
watcher = "yellow"
build = "cyan"
runner = "green"

[misc]
clean_on_exit = true
